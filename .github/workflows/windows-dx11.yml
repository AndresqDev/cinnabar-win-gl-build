name: Windows DX11 build

# Native Direct3D 11 build backed by wgpu-hal's experimental D3D11 backend.
# The D3D11 backend is still under construction, so this workflow is manual
# until the first playable milestone.

on:
  workflow_dispatch:
  push:
    branches: [dx11-build]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CINNABAR_BUILD_COMMIT: ${{ github.sha }}
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  SCCACHE_CACHE_SIZE: 8G
  ELECTRON_VERSION: "35.7.5"

jobs:
  build:
    name: Build Cinnabar with native DX11
    runs-on: windows-2025
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          cache: false

      - name: Show toolchain versions
        shell: bash
        run: |
          rustc --version
          cargo --version
          go version

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.9

      - name: Configure sccache GHA backend
        uses: actions/github-script@v7
        with:
          script: |
            core.exportVariable('ACTIONS_RESULTS_URL', process.env.ACTIONS_RESULTS_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Build Rust client and tools
        shell: bash
        run: |
          cargo build --profile play --locked --no-default-features \
            -p cinnabar -p asset-compiler -p update-installer

      - name: Build Go core and local server
        shell: bash
        run: |
          go build -tags joinprofile \
            -ldflags "$(bash packaging/common/core-ldflags.sh)" \
            -o target/play/bedrock-core.exe ./core/cmd/bedrock-core
          (
            cd tools/localserver
            GOWORK=off go build -o ../../target/play/bedrock-local-server.exe .
          )

      - name: Stage portable Windows payload
        shell: pwsh
        run: |
          ./.github/scripts/stage-windows-payload.ps1 -Root "$PWD" -Out "$PWD/dist/Cinnabar-Windows-DX11"

      - name: Add DX11 launcher and FXC runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $zip = Join-Path $env:RUNNER_TEMP "electron-d3dcompiler.zip"
          $dir = Join-Path $env:RUNNER_TEMP "electron-d3dcompiler"
          $url = "https://github.com/electron/electron/releases/download/v$env:ELECTRON_VERSION/electron-v$env:ELECTRON_VERSION-win32-x64.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force

          $out = Join-Path $PWD "dist/Cinnabar-Windows-DX11"
          Copy-Item (Join-Path $dir "d3dcompiler_47.dll") (Join-Path $out "d3dcompiler_47.dll") -Force
          Copy-Item (Join-Path $dir "LICENSE") (Join-Path $out "Electron-LICENSE.txt") -Force
          Copy-Item (Join-Path $dir "LICENSES.chromium.html") `
            (Join-Path $out "THIRD_PARTY_LICENSES.chromium.html") -Force
          Copy-Item "packaging/windows/run-dx11.bat" $out -Force

          Get-ChildItem $out | Format-Table Name, Length

      - name: Archive DX11 payload
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/Cinnabar-Windows-DX11/*" `
            -DestinationPath "dist/Cinnabar-Windows-DX11-${{ github.sha }}.zip" -CompressionLevel Optimal

      - name: Show sccache statistics
        if: always()
        shell: bash
        run: sccache --show-stats || true

      - uses: actions/upload-artifact@v7
        with:
          name: Cinnabar-Windows-DX11
          path: |
            dist/Cinnabar-Windows-DX11
            dist/Cinnabar-Windows-DX11-*.zip
          if-no-files-found: error
          retention-days: 7
